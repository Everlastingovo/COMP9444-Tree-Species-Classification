experiment_name: mobilenetv2_frozen

dataset:
  data_root: data/raw/5061353/leafsnap-dataset-30subset
  use_splits: true
  split_dir: data/splits
  image_source: all
  normalization: imagenet

model:
  name: mobilenetv2_frozen
  pretrained: true
  image_size: 224
  fine_tune_mode: frozen
  unfreeze_blocks: 4

training:
  seed: 42
  epochs: 15
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 4
  max_batches: null
  amp: true
  early_stopping_patience: 5
  selection_metric: val_macro_f1
  evaluate_test: false

output:
  dir: outputs/mobilenetv2/frozen_seed42
