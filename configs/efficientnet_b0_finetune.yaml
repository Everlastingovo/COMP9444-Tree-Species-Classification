experiment_name: efficientnet_b0_finetune

model:
  num_classes: 30
  pretrained: true
  trainable_scope: last_blocks
  image_size: 224
  normalization: imagenet
  initial_checkpoint: outputs/efficientnet_b0/frozen/best_model.pt

training:
  epochs: 10
  batch_size: 16
  learning_rate: 0.00003
  weight_decay: 0.0001
  seed: 42
  num_workers: 0

output:
  dir: outputs/efficientnet_b0/finetune
